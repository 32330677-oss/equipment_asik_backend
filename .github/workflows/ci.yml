# Runs the backend tests on every push and pull request.
# Uses a throw-away MySQL 8 inside GitHub Actions; never touches production.
# The test database name must end with _test (tests/helpers.js refuses anything else).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME: equipment_asik_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check MySQL
        run: mysql -h127.0.0.1 -P3306 -uroot -proot -e "SELECT VERSION();"

      - name: Run tests
        run: npm test
